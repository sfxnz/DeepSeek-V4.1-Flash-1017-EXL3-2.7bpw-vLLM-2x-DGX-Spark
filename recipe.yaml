readme:
  defaults:
    - Image: "`{IMAGE}`"
    - Model: "`{MODEL}` revision `{SNAPSHOT_SHA}`"
    - "`--tensor-parallel-size` / `--nnodes`": "{TP} / {NNODES}"
    - "`--max-model-len`": "{MAX_MODEL_LEN}"
    - "`--max-num-seqs`": "{MAX_NUM_SEQS}"
    - "`--max-num-batched-tokens`": "{MAX_NUM_BATCHED_TOKENS}"
    - "`--kv-cache-dtype`": "`{KV_CACHE_DTYPE}`"
    - "`--kv-cache-memory`": "{KV_CACHE_MEMORY}"
    - KV cache groups: "packed, one layer-pattern repeat per group (`DSV41_KV_PACKED_GROUPS={DSV41_KV_PACKED_GROUPS}`, vLLM PR #60996): 50 groups on 46,080-byte blocks; `0` restores the image's 18 groups on 138,240-byte blocks"
    - "`--quantization`": "`{QUANTIZATION}`"
    - Engram: "disk (`DSV41_ENGRAM_DISK={DSV41_ENGRAM_DISK}`)"
    - "`--block-size`": "{BLOCK_SIZE}"
    - "`--prefix-cache-retention-interval`": "{PREFIX_CACHE_RETENTION_INTERVAL} (sliding-window prefix-cache checkpoint every 4096 tokens; vLLM's default 0 keeps only the replay boundary)"
    - Speculative: "DSpark (`SPEC={SPEC}`): the verify width follows the running batch size, `NUM_SPECULATIVE_TOKENS_PER_BATCH={NUM_SPECULATIVE_TOKENS_PER_BATCH}` (k=5 at 1-2 requests, k=3 at 3-4; the DSpark block is the largest k), with adaptive verify `DSV41_DSPARK_ADAPTIVE={DSV41_DSPARK_ADAPTIVE}` (TAU 0.15); `NUM_SPECULATIVE_TOKENS_PER_BATCH=0` gives one k, `NUM_SPECULATIVE_TOKENS={NUM_SPECULATIVE_TOKENS}`"
    - CUDA graphs: "`FULL_AND_PIECEWISE`, capture sizes {1} ∪ {s·K} ∪ {s·(k_c+1) : s ≤ c} for the block K and the width k_c at batch size c (`[1,4,5,6,8,10,12,15,16,20]` at `1-2:5,3-4:3`), {1} ∪ {s·k, s·(k+1)} with one k (`[1,3,4,6,8,9,12,16]` at k=3), s and c up to `--max-num-seqs` (`ENFORCE_EAGER={ENFORCE_EAGER}`, `DSV41_ALLOW_CUDA_GRAPHS={DSV41_ALLOW_CUDA_GRAPHS}`)"
    - Engram prefetch / census / gather: "`DSV41_ENGRAM_PREFETCH={DSV41_ENGRAM_PREFETCH}` `DSV41_ENGRAM_CENSUS={DSV41_ENGRAM_CENSUS}` `DSV41_ENGRAM_GATHER_V2={DSV41_ENGRAM_GATHER_V2}`"
    - Engram prefill read-ahead: "`DSV41_ENGRAM_WILLNEED={DSV41_ENGRAM_WILLNEED}` (gv2 calls with >= 512 rows fadvise their pages before the preadv loop) `DSV41_ENGRAM_PREFILL_AHEAD={DSV41_ENGRAM_PREFILL_AHEAD}` (the next chunk's rows are read on 8 threads while the current chunk computes, and used only where they match the GPU's hash ids; `_DONTNEED=1` drops the pages a prefill read brought in)"
    - lm_head: "MXFP8 (`DSV41_LMHEAD_MXFP8={DSV41_LMHEAD_MXFP8}`), needs an lm_head-MXFP8 pack (`{SNAPSHOT_SHA}` is one: `tools/build_pack_1017.py` converts source shard 43); self-disarms on a bf16-head pack"
    - Weight-load stream feed: "`DSV41_STREAM_FEED={DSV41_STREAM_FEED}`"
    - Decode levers: "`DSV41_WOA_PREPACK={DSV41_WOA_PREPACK}` (needs the `{IMAGE}` o_proj stage) `DSV41_DSPARK_SPARSE_MARKOV={DSV41_DSPARK_SPARSE_MARKOV}` `DSV41_DSPARK_SPARSE_MARKOV_TOPK={DSV41_DSPARK_SPARSE_MARKOV_TOPK}`"
    - Round-3 kernel bundle: "`DSV41_P2B_COOP={DSV41_P2B_COOP}` (coop dataflow MoE kernel, needs the `{IMAGE}` build) `DSV41_DENSE_GEMV={DSV41_DENSE_GEMV}` `DSV41_MHC_DET_SPLITS={DSV41_MHC_DET_SPLITS}` `DSV41_ENGRAM_NATIVE_STAGE={DSV41_ENGRAM_NATIVE_STAGE}` `DSV41_ENGRAM_EARLY_HASH={DSV41_ENGRAM_EARLY_HASH}` `DSV41_ATTN_T2R_DEDUP={DSV41_ATTN_T2R_DEDUP}` `DSV41_SWA_META_FUSED={DSV41_SWA_META_FUSED}` `DSV41_SWA_META_BATCHED={DSV41_SWA_META_BATCHED}` `DSV41_MOE_PREP_FUSED={DSV41_MOE_PREP_FUSED}` `DSV41_CANDIDATE_MASK_BOUNDED={DSV41_CANDIDATE_MASK_BOUNDED}` `DSV41_INDEXER_WP_GEMV={DSV41_INDEXER_WP_GEMV}` (set one to `0` to turn it off)"
    - KP add-ons (round 35, on since perf2): "`DSV41_PM_QOS_US={DSV41_PM_QOS_US}` (a CPU wake-up latency request through `/dev/cpu_dma_latency`, host-wide while the serve runs) `DSV41_ENGRAM_WKV_TP={DSV41_ENGRAM_WKV_TP}` (Engram wkv column-parallel, half the rows per rank) `DSV41_MHC_DET_OVERLAP={DSV41_MHC_DET_OVERLAP}` (det mHC prenorm GEMM + sinkhorn under the next all-reduce); `0` turns one off"
    - Prefill MoE: "`DSV41_MOE_PREFILL_TC={DSV41_MOE_PREFILL_TC}` (tensor-core EXL3 routed-MoE kernel for calls of >= 9 rows, prebuilt in `{IMAGE}`; self-checked and verified against the stock path at boot; `0` = stock `exl3_moe` / fat path)"
    - Decoder replay (CED prefill skip): "`DSV41_DECODER_REPLAY_ROWS={DSV41_DECODER_REPLAY_ROWS}`: in eager prefill steps layer 20 writes its KV for every row and layers 20-39 run on kept rows only: W >= 2414 keeps each prompt's last W rows (exact), 128 keeps each chunk's last 128 rows (the upstream/DeepSeek approximation), 0 is off; SWA blocks of skipped rows stay out of the prefix cache, so a later prompt reuses a trimmed prompt's KV only if it diverges no earlier than 64 tokens before the prompt's last 128-token boundary (with the prefix-end fallback), or at a shared-prefix junction: the second request sharing a system prompt keeps up to 2542 more decoder rows ending there and the third hits it, as with stock e15"
    - Prefix-end fallback: "`DSV41_PREFIX_END_FALLBACK={DSV41_PREFIX_END_FALLBACK}`: SWA groups also keep the prefix-cache tail one 128-token hit unit below each prompt end (and shared-prefix junction), so every resend or follow-up that diverges at the prompt end hits within 192 tokens; e15 alone misses for about half of all prompt lengths (0 = stock)"
    - Prefix reply retention: "`DSV41_PREFIX_REPLY_RETAIN={DSV41_PREFIX_REPLY_RETAIN}`: SWA blocks filled during decode enter the prefix cache as they fill, so a follow-up that repeats the assistant reply verbatim hits within 192 tokens of the shared end instead of prefilling the reply again (0 = stock)"
    - Prefill sharing: "`DSV41_SCHED_PREFILL_CAP={DSV41_SCHED_PREFILL_CAP}` `DSV41_SCHED_DECODE_STEPS={DSV41_SCHED_DECODE_STEPS}`: while the scheduler holds more than one request, each prefilling request takes at most CAP tokens per step and STEPS decode-only steps follow each step that carried prefill, so the other sessions keep decoding through a long prefill; a request alone in the scheduler is scheduled as stock (0 = stock)"
    - NCCL AR-tail set: "`NCCL_BUFFSIZE={NCCL_BUFFSIZE}` `NCCL_LL128_BUFFSIZE={NCCL_LL128_BUFFSIZE}` `NCCL_PROTO={NCCL_PROTO}` `NCCL_MAX_NCHANNELS={NCCL_MAX_NCHANNELS}`"
    - Memory hygiene: "`DSV41_DROP_PAGE_CACHE={DSV41_DROP_PAGE_CACHE}` `DSV41_INDEXER_PREFILL_FACTOR={DSV41_INDEXER_PREFILL_FACTOR}` `DSV41_INDEXER_EXPANDED_TABLE_LAZY={DSV41_INDEXER_EXPANDED_TABLE_LAZY}` `DSV41_PREFILL_EMPTY_CACHE_TOKENS={DSV41_PREFILL_EMPTY_CACHE_TOKENS}` `DSV41_PREFILL_EMPTY_CACHE_MEMAVAIL_GIB={DSV41_PREFILL_EMPTY_CACHE_MEMAVAIL_GIB}` `DSV41_PREFILL_EMPTY_CACHE_HOLD={DSV41_PREFILL_EMPTY_CACHE_HOLD}` (no release while a prompt is in flight unless MemAvailable < `DSV41_PREFILL_EMPTY_CACHE_FLOOR_GIB={DSV41_PREFILL_EMPTY_CACHE_FLOOR_GIB}` GiB or the held pool grows more than `DSV41_PREFILL_EMPTY_CACHE_GROWTH_MIB={DSV41_PREFILL_EMPTY_CACHE_GROWTH_MIB}` MiB beyond what the steps' peak need explains) `DSV41_PREFILL_EMPTY_CACHE_COUNT_PCP={DSV41_PREFILL_EMPTY_CACHE_COUNT_PCP}` (those MemAvailable rules count the free pages on the kernel's per-CPU lists) `DSV41_FAT_SCRATCH_SHARED={DSV41_FAT_SCRATCH_SHARED}` (one vllm_exl3 fat-expert scratch set) `DSV41_MODEL_LOOP_RELEASE={DSV41_MODEL_LOOP_RELEASE}` `DSV41_ATTN_OUT_DEFER={DSV41_ATTN_OUT_DEFER}` `DSV41_ENGRAM_POST_INPLACE={DSV41_ENGRAM_POST_INPLACE}` (prefill transient cuts, bit-identical) `VLLM_SPARSE_INDEXER_MAX_LOGITS_MB={VLLM_SPARSE_INDEXER_MAX_LOGITS_MB}`"
    - Tokenizers / tools / reasoning: "`deepseek_v41`"
    - Vision: "on (`LANGUAGE_MODEL_ONLY={LANGUAGE_MODEL_ONLY}`)"
    - "`--mm-encoder-tp-mode`": "{MM_ENCODER_TP_MODE}"
    - "`--mm-processor-cache-gb`": "{MM_PROCESSOR_CACHE_GB} (vLLM default 4, mirrored in the API server and EngineCore on the head)"
    - 16-bit grayscale images: "scaled to 8-bit by 1/257, as the DeepSeek API does (`DSV41_IMAGE_16BIT_GRAY={DSV41_IMAGE_16BIT_GRAY}`); Pillow alone clamps them to 255, almost white (0 = stock)"
    - Default thinking: "`thinking=false`, no default effort: a request that turns thinking on without `reasoning_effort` gets `high` (75), the DeepSeek API default"
    - "`tool_choice: none`": "renders no tools (`--exclude-tools-when-tool-choice-none`), as the DeepSeek API does"
    - Structured outputs: "xgrammar, pinned (`--structured-outputs-config '{\"backend\":\"xgrammar\"}'`): under `auto` the first structured request fixes the engine's only backend, and a `json_schema` that falls back to guidance makes every later required or named `tool_choice` fail until restart; a schema xgrammar cannot compile is a 400 instead"
    - Stop strings: "up to {VLLM_MAX_STOP_STRINGS} per request (`VLLM_MAX_STOP_STRINGS={VLLM_MAX_STOP_STRINGS}`, the DeepSeek API's limit; at vLLM's default of 4, a fifth stop string is a 400)"
    - Usage: "`prompt_tokens_details.cached_tokens` (`--enable-prompt-tokens-details`); on `/v1/messages`, cached tokens move from `input_tokens` to `cache_read_input_tokens`"
    - API gateway: "on (`API_GATEWAY={API_GATEWAY}`): `{GATEWAY_CONTAINER_NAME}` on the head (no GPU, `--memory {GATEWAY_MEMORY}`, `--restart on-failure:3`) serves the DeepSeek API (deepseek-recipe 0.2.0: Chat Completions, Anthropic Messages, Responses) on port {PORT}, in front of vLLM on `127.0.0.1:{VLLM_PORT}` (`VLLM_ENABLE_SCALE_OUT_ENDPOINTS=1` and `--max-logprobs 21` on both ranks); a request the API rejects or one with a vLLM-only field goes to vLLM unchanged (`x-dsv41-gateway: fallback`); `API_GATEWAY=0` serves vLLM on `0.0.0.0:{PORT}` without either"
    - Gateway options: "`DSV41_GATEWAY_STRICT={DSV41_GATEWAY_STRICT}` (1: the API's error instead of the vLLM fallback) `DSV41_GATEWAY_BLOCK_PRIVATE_URLS={DSV41_GATEWAY_BLOCK_PRIVATE_URLS}` (1: refuse image URLs that resolve to loopback, private, link-local, multicast or reserved addresses, redirects included)"
    - deepseek-recipe wheel: "the PyPI wheel pinned by URL and sha256 in recipe.yaml (`GATEWAY_WHEEL_URL`, `GATEWAY_WHEEL_SHA256`), fetched on the head at the first gateway boot (never with `SKIP_DOWNLOAD=1`; a wheel already in `~/.cache/dsv41-gateway/` is used) and sha256-checked before it is unpacked there"
    - Post-ready: "engagement audit of both ranks' logs and the gateway's (`AUDIT={AUDIT}`; `strict` fails the boot, `off` skips), then greedy, t=0.7, ~3k/~1k/~300-token nonce prefill and small-image warmup requests through port {PORT} (`WARMUP={WARMUP}`)"
    - API: "`http://<head>:{PORT}/v1`"
    - Container: "`{CONTAINER_NAME}` (vLLM, both nodes), `{GATEWAY_CONTAINER_NAME}` (API gateway, head)"
    - Master port: "{MASTER_PORT}"

