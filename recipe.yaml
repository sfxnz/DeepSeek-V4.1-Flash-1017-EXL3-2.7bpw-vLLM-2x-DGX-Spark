# Source of truth. Edit here, then `python3 kit/render.py`.
model:
  id: &model sfxnz/DeepSeek-V4.1-Flash-1017-EXL3
  revision: &revision 2.7bpw-mcg-hq
  served_name: &served_name deepseek-ai/DeepSeek-V4.1-Flash-1017
  family: DeepSeek-V4.1-Flash-1017
  source: deepseek-ai/DeepSeek-V4.1-Flash-1017@1bae0e1088993b9b82de08f59de5be5a34e42170
  params: 552B backbone / 8B prefill / 16B decode, plus 196B Engram
  quant: EXL3 2.70 bpw routed experts (MCG, K in {2,3,4} per layer and projection group from tools/calib/alloc/expert_bits_2.70.json, Viterbi encode with real activation Hessians), source MXFP8/MXFP4 elsewhere (DSpark/MTP experts MXFP4), lm_head MXFP8, Engram on NVMe

image:
  base: vllm/vllm-openai:deepseekv41-flash-0909
  digest: sha256:d84a123255b822fc22508635218000187221794f59c0694c33b0650d1e377d58
  # Kernel image e16-rows (K-bits + 9..24-row decode MoE): docker/Dockerfile (from scratch) or
  # docker/Dockerfile.e16 (layered on e15-kbits, which docker/Dockerfile.e15 layers on canonical-e14).
  local_tag: &image dsv41-flash-exl3-sm121:e16-rows
  build: docker/Dockerfile

engine:
  name: vllm
  version: dsv41-flash-0909 + vllm-exl3 native p2b (cb=1 MCG / cb=2 MUL1, K-bits dataflow) + Engram-on-disk

hardware:
  shape: 2x DGX Spark (GB10)
  nnodes: &nnodes 2
  tp: &tp 2

serve:
  env:
    MODEL: *model
    SERVED_NAME: *served_name
    IMAGE: *image
    CONTAINER_NAME: dsv41-flash-exl3
    PORT: 8000
    MASTER_PORT: 29524
    HEAD_IP: 10.100.8.1
    WORKER_HOST: spark2
    IFACE: enp1s0f1np1
    HCA: rocep1s0f1
    TP: *tp
    NNODES: *nnodes
    MAX_MODEL_LEN: 500000
    MAX_NUM_SEQS: 4
    UTIL: 0.75
    KV_CACHE_DTYPE: fp8
    KV_CACHE_MEMORY: 4160749568
    DSV41_KV_PACKED_GROUPS: 1
    BLOCK_SIZE: 64
    PREFIX_CACHE_RETENTION_INTERVAL: 4096
    NUM_SPECULATIVE_TOKENS: 3
    SPEC: dspark
    LOAD_FORMAT: auto
    QUANTIZATION: exl3
    DSV41_ENGRAM_DISK: 1
    LANGUAGE_MODEL_ONLY: 0
    MM_ENCODER_TP_MODE: data
    MM_PROCESSOR_CACHE_GB: 1
    MAX_NUM_BATCHED_TOKENS: 8192
    FORCE_UNSAFE_CTX: 0
    FORCE_UNSAFE_ENGRAM: 0
    FORCE_UNSAFE_QUANT: 0
    ENFORCE_EAGER: 0
    DSV41_ALLOW_CUDA_GRAPHS: 1
    VLLM_USE_BREAKABLE_CUDAGRAPH: 1
    HF_CACHE: $HOME/.cache/huggingface
    SNAPSHOT_SHA: *revision
    SKIP_DOWNLOAD: 0
    ORCHESTRATE: auto
    AUDIT: warn
    WARMUP: 1
    EXTRA_ARGS: ""
    DSV41_ENGRAM_PREFETCH: 1
    DSV41_ENGRAM_CENSUS: 1
    DSV41_ENGRAM_GATHER_V2: 1
    DSV41_ENGRAM_WILLNEED: 1
    DSV41_LMHEAD_MXFP8: 1
    DSV41_STREAM_FEED: 1
    DSV41_WOA_PREPACK: 1
    DSV41_DSPARK_SPARSE_MARKOV: 1
    DSV41_DSPARK_SPARSE_MARKOV_TOPK: 1024
    DSV41_P2B_COOP: 2
    DSV41_DENSE_GEMV: 1
    DSV41_MHC_DET_SPLITS: 16
    DSV41_ENGRAM_NATIVE_STAGE: 1
    DSV41_ENGRAM_EARLY_HASH: 1
    DSV41_ATTN_T2R_DEDUP: 1
    DSV41_SWA_META_FUSED: 1
    DSV41_SWA_META_BATCHED: 1
    DSV41_MOE_PREP_FUSED: 1
    DSV41_CANDIDATE_MASK_BOUNDED: 1
    DSV41_INDEXER_WP_GEMV: 1
    DSV41_MOE_PREFILL_TC: 1
    NCCL_BUFFSIZE: 1048576
    NCCL_LL128_BUFFSIZE: 262144
    NCCL_PROTO: ^LL128
    NCCL_MAX_NCHANNELS: 8
    DSV41_DROP_PAGE_CACHE: 1
    DSV41_INDEXER_PREFILL_FACTOR: 1
    DSV41_INDEXER_EXPANDED_TABLE_LAZY: 1
    DSV41_PREFILL_EMPTY_CACHE_TOKENS: 8192
    DSV41_PREFILL_EMPTY_CACHE_MEMAVAIL_GIB: 4
    VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: 256

readme:
  defaults:
    - Image: "`{IMAGE}`"
    - Model: "`{MODEL}` revision `{SNAPSHOT_SHA}`"
    - "`--tensor-parallel-size` / `--nnodes`": "{TP} / {NNODES}"
    - "`--max-model-len`": "{MAX_MODEL_LEN}"
    - "`--max-num-seqs`": "{MAX_NUM_SEQS}"
    - "`--max-num-batched-tokens`": "{MAX_NUM_BATCHED_TOKENS}"
    - "`--kv-cache-dtype`": "`{KV_CACHE_DTYPE}`"
    - "`--kv-cache-memory`": "{KV_CACHE_MEMORY}"
    - KV cache groups: "packed, one layer-pattern repeat per group (`DSV41_KV_PACKED_GROUPS={DSV41_KV_PACKED_GROUPS}`, vLLM PR #60996): 50 groups on 46,080-byte blocks; `0` restores the image's 18 groups on 138,240-byte blocks"
    - "`--quantization`": "`{QUANTIZATION}`"
    - Engram: "disk (`DSV41_ENGRAM_DISK={DSV41_ENGRAM_DISK}`)"
    - "`--block-size`": "{BLOCK_SIZE}"
    - "`--prefix-cache-retention-interval`": "{PREFIX_CACHE_RETENTION_INTERVAL} (sliding-window prefix-cache checkpoint every 4096 tokens; vLLM's default 0 keeps only the replay boundary)"
    - Speculative: "DSpark-{NUM_SPECULATIVE_TOKENS} (`SPEC={SPEC}`)"
    - CUDA graphs: "`FULL_AND_PIECEWISE`, capture sizes {1} ∪ {s·k, s·(k+1)} for s ≤ `--max-num-seqs` (`[1,3,4,6,8,9,12,16]` at k=3) (`ENFORCE_EAGER={ENFORCE_EAGER}`, `DSV41_ALLOW_CUDA_GRAPHS={DSV41_ALLOW_CUDA_GRAPHS}`)"
    - Engram prefetch / census / gather: "`DSV41_ENGRAM_PREFETCH={DSV41_ENGRAM_PREFETCH}` `DSV41_ENGRAM_CENSUS={DSV41_ENGRAM_CENSUS}` `DSV41_ENGRAM_GATHER_V2={DSV41_ENGRAM_GATHER_V2}`"
    - Engram prefill read-ahead: "`DSV41_ENGRAM_WILLNEED={DSV41_ENGRAM_WILLNEED}` (gv2 calls with >= 512 rows fadvise their pages before the preadv loop)"
    - lm_head: "MXFP8 (`DSV41_LMHEAD_MXFP8={DSV41_LMHEAD_MXFP8}`), needs an lm_head-MXFP8 pack (`{SNAPSHOT_SHA}` is one: `tools/build_pack_1017.py` converts source shard 43); self-disarms on a bf16-head pack"
    - Weight-load stream feed: "`DSV41_STREAM_FEED={DSV41_STREAM_FEED}`"
    - Decode levers: "`DSV41_WOA_PREPACK={DSV41_WOA_PREPACK}` (needs the `{IMAGE}` o_proj stage) `DSV41_DSPARK_SPARSE_MARKOV={DSV41_DSPARK_SPARSE_MARKOV}` `DSV41_DSPARK_SPARSE_MARKOV_TOPK={DSV41_DSPARK_SPARSE_MARKOV_TOPK}`"
    - Round-3 kernel bundle: "`DSV41_P2B_COOP={DSV41_P2B_COOP}` (coop dataflow MoE kernel, needs the `{IMAGE}` build) `DSV41_DENSE_GEMV={DSV41_DENSE_GEMV}` `DSV41_MHC_DET_SPLITS={DSV41_MHC_DET_SPLITS}` `DSV41_ENGRAM_NATIVE_STAGE={DSV41_ENGRAM_NATIVE_STAGE}` `DSV41_ENGRAM_EARLY_HASH={DSV41_ENGRAM_EARLY_HASH}` `DSV41_ATTN_T2R_DEDUP={DSV41_ATTN_T2R_DEDUP}` `DSV41_SWA_META_FUSED={DSV41_SWA_META_FUSED}` `DSV41_SWA_META_BATCHED={DSV41_SWA_META_BATCHED}` `DSV41_MOE_PREP_FUSED={DSV41_MOE_PREP_FUSED}` `DSV41_CANDIDATE_MASK_BOUNDED={DSV41_CANDIDATE_MASK_BOUNDED}` `DSV41_INDEXER_WP_GEMV={DSV41_INDEXER_WP_GEMV}` (set one to `0` to turn it off)"
    - Prefill MoE: "`DSV41_MOE_PREFILL_TC={DSV41_MOE_PREFILL_TC}` (tensor-core EXL3 routed-MoE kernel for calls of >= 9 rows, prebuilt in `{IMAGE}`; self-checked and verified against the stock path at boot; `0` = stock `exl3_moe` / fat path)"
    - NCCL AR-tail set: "`NCCL_BUFFSIZE={NCCL_BUFFSIZE}` `NCCL_LL128_BUFFSIZE={NCCL_LL128_BUFFSIZE}` `NCCL_PROTO={NCCL_PROTO}` `NCCL_MAX_NCHANNELS={NCCL_MAX_NCHANNELS}`"
    - Memory hygiene: "`DSV41_DROP_PAGE_CACHE={DSV41_DROP_PAGE_CACHE}` `DSV41_INDEXER_PREFILL_FACTOR={DSV41_INDEXER_PREFILL_FACTOR}` `DSV41_INDEXER_EXPANDED_TABLE_LAZY={DSV41_INDEXER_EXPANDED_TABLE_LAZY}` `DSV41_PREFILL_EMPTY_CACHE_TOKENS={DSV41_PREFILL_EMPTY_CACHE_TOKENS}` `DSV41_PREFILL_EMPTY_CACHE_MEMAVAIL_GIB={DSV41_PREFILL_EMPTY_CACHE_MEMAVAIL_GIB}` `VLLM_SPARSE_INDEXER_MAX_LOGITS_MB={VLLM_SPARSE_INDEXER_MAX_LOGITS_MB}`"
    - Tokenizers / tools / reasoning: "`deepseek_v41`"
    - Vision: "on (`LANGUAGE_MODEL_ONLY={LANGUAGE_MODEL_ONLY}`)"
    - "`--mm-encoder-tp-mode`": "{MM_ENCODER_TP_MODE}"
    - "`--mm-processor-cache-gb`": "{MM_PROCESSOR_CACHE_GB} (vLLM default 4, mirrored in the API server and EngineCore on the head)"
    - Default thinking: "`thinking=false`, `reasoning_effort=low`"
    - Post-ready: "engagement audit of both ranks' logs (`AUDIT={AUDIT}`; `strict` fails the boot, `off` skips), then greedy, t=0.7, ~3k/~1k/~300-token nonce prefill and small-image warmup requests (`WARMUP={WARMUP}`)"
    - API: "`http://<head>:{PORT}/v1`"
    - Container: "`{CONTAINER_NAME}`"
    - Master port: "{MASTER_PORT}"

measured:
  decode:
    conditions: "1017 release, boot D1 (2026-10-18 18:23Z, one boot, 2 nodes): `SKIP_DOWNLOAD=1 AUDIT=strict KV_CACHE_MEMORY=4160749568 ./run.sh` (boot-d1/command.txt; that KV value is now the default), image dsv41-flash-exl3-sm121:e15-kbits (sha256:7e2cec199bed), pack sfxnz/DeepSeek-V4.1-Flash-1017-EXL3 @ 2.7bpw-mcg-hq, release defaults otherwise (DSpark-3 greedy verify + captures [1,3,4,6,8], the round-34/35 levers on, vision on, Engram on disk). Audit ok on head and worker, 40 per-rank boot lines \"routed experts K_gu/K_d\" matching the allocation, smokes 323 / Red, warmup ok. Each row is the median of the per-run values. bench_decode.py = streamed greedy 200 tokens thinking off, ignore_eos, 9 runs at c=1 (boot-d1/bench_decode.txt), 5 runs at c=2 (boot-d1/bench_decode_c2.txt); the prose natural run stops at 83 tokens. L.A.I.L prose = tools/measure_lail_prose.py 512 tokens temperature 0.2, 3 runs (boot-d1/e2e.txt). Quality: quality_eval --full PASS; results/2026-10-18-1017/quality-baseline/full.json is the 1017 baseline. Sept 2.0 bpw pack history: github.com/sfxnz/DeepSeek-V4.1-Flash-EXL3-vLLM-2x-DGX-Spark @ 3de9146. These rows predate the 4-session defaults (D1 ran MAX_NUM_SEQS=2, MAX_MODEL_LEN=1048576, the image's 18 KV groups); c=3/c=4 rows and a re-measure on the current defaults are pending."
    units: {decode: tok/s per stream (median), aggregate: tok/s, ttft_p50: s}
    rows:
      - {phase: prose, concurrency: 1, decode: "49.6", aggregate: "49.6", ttft_p50: "0.24", evidence: results/2026-10-18-1017/boot-d1/bench_decode.txt}
      - {phase: prose, concurrency: 2, decode: "38.4", aggregate: "75.8", ttft_p50: "0.28", evidence: results/2026-10-18-1017/boot-d1/bench_decode_c2.txt}
      - {phase: structured, concurrency: 1, decode: "77.0", aggregate: "77.0", ttft_p50: "0.19", evidence: results/2026-10-18-1017/boot-d1/bench_decode.txt}
      - {phase: structured, concurrency: 2, decode: "70.2", aggregate: "140.3", ttft_p50: "0.23", evidence: results/2026-10-18-1017/boot-d1/bench_decode_c2.txt}
      - {phase: lail_prose, concurrency: 1, decode: "39.6", aggregate: "39.6", ttft_p50: "0.34", evidence: results/2026-10-18-1017/boot-d1/e2e.txt}

